services:
  influxdb:
    image: influxdb:2.7
    container_name: fuel-app-influxdb
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-change-me-influxdb-password}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-fuelapp}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-fuel_prices}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-auth-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  fuelapp:
    build: .
    container_name: fuel-app
    ports:
      - "5000:5000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-auth-token}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-fuelapp}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-fuel_prices}
      - DATA_DIR=/app/config
    volumes:
      # Mount config file - copy config.yaml.docker to config.yaml before starting
      # or edit docker-compose.yml to mount config.yaml.docker directly
      - ./config.yaml.docker:/app/config.yaml:ro
      - ./data:/app/config
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: fuel-app-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-change-me-grafana-password}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M


volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:

